name: Build Nortica image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build image
        run: make iso

      - name: Prepare release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release-assets
          images=(iso/nortica-live-amd64-*.iso)
          [[ ${#images[@]} == 1 && -s ${images[0]} ]] || {
            echo 'Expected one completed ISO in the fresh build workspace.' >&2
            exit 1
          }
          image=${images[0]##*/}
          cp "iso/$image" "iso/$image.sha256" release-assets/
          size=$(stat -c %s "release-assets/$image")
          if ((size >= 1900 * 1024 * 1024)); then
            split --bytes=1800M --numeric-suffixes=0 --suffix-length=3 \
              "release-assets/$image" "release-assets/$image.part."
            rm "release-assets/$image"
            cat > release-assets/REASSEMBLE.txt <<EOF
          The ISO was split into GitHub Release assets to meet the per-file size limit.
          Put every $image.part.* file in one directory and run:

              cat $image.part.* > $image
              sha256sum -c $image.sha256
          EOF
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nortica-live-${{ github.ref_name }}
          path: |
            iso/*.iso
            iso/*.iso.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
