name: Build Nortica image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build image
        run: make iso

      - name: Prepare release assets
        id: release-assets
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release-assets
          cp iso/nortica-live-amd64.iso iso/SHA256SUMS release-assets/
          size=$(stat -c %s release-assets/nortica-live-amd64.iso)
          if ((size >= 1900 * 1024 * 1024)); then
            mv release-assets/nortica-live-amd64.iso release-assets/nortica-live-amd64.iso.full
            split --bytes=1800M --numeric-suffixes=0 --suffix-length=3 \
              release-assets/nortica-live-amd64.iso.full \
              release-assets/nortica-live-amd64.iso.part.
            rm release-assets/nortica-live-amd64.iso.full
            cat > release-assets/REASSEMBLE.txt <<'EOF'
          The ISO was split into GitHub Release assets to meet the per-file size limit.
          Put every nortica-live-amd64.iso.part.* file in one directory and run:

              cat nortica-live-amd64.iso.part.* > nortica-live-amd64.iso
              sha256sum -c SHA256SUMS
          EOF
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nortica-live-${{ github.ref_name }}
          path: |
            iso/nortica-live-amd64.iso
            iso/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
